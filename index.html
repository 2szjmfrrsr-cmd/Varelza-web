<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VARELZA — Muy pronto</title>
<meta name="description" content="Todo bajo un mismo techo. El portal de VARELZA está en construcción.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#E8825C; --green-dark:#C86640; --green-soft:#FBE4D9;
    --orange:#8FA888; --orange-dark:#6B8865; --orange-soft:#EAF0E7;
    --ink:#2E3130; --gray:#84867F; --fondo:#FBFAF7; --border:#ECEAE2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: linear-gradient(120deg, var(--green-soft) 0%, var(--orange-soft) 100%);
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .roof{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-56%);
    width:min(90vw, 640px);
    opacity:0.35;
    pointer-events:none;
  }
  .roof path{
    fill:none;
    stroke:var(--ink);
    stroke-width:10;
    stroke-linecap:round;
    animation: breathe 6s ease-in-out infinite;
  }
  .roof path.right{ animation-delay: -3s; }
  @keyframes breathe{
    0%,100%{ opacity:0.5; }
    50%{ opacity:0.9; }
  }
  @media (prefers-reduced-motion: reduce){
    .roof path{ animation:none; }
  }

  .card{
    position:relative;
    text-align:center;
    padding:0 24px;
    max-width:520px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--orange-dark);
    margin:0 0 22px;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-size:clamp(42px, 9vw, 68px);
    line-height:1;
    margin:0;
    letter-spacing:-1px;
  }
  .wordmark .var{
    font-weight:600;
    color:var(--ink);
  }
  .wordmark .elza{
    font-weight:500;
    font-style:italic;
    color:var(--green);
  }
  .tagline{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    color:var(--green-dark);
    font-size:clamp(16px, 3vw, 20px);
    margin:14px 0 34px;
  }
  .msg{
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 30px;
  }
  .contact{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:14px;
    color:var(--fondo);
    background:var(--green);
    padding:13px 26px;
    border-radius:999px;
    text-decoration:none;
    box-shadow: 0 8px 20px rgba(232,130,92,0.35);
  }
  .contact:hover{ background:var(--green-dark); }
  footer{
    position:absolute;
    bottom:26px;
    left:0; right:0;
    text-align:center;
    font-size:12px;
    color:var(--gray);
    font-weight:600;
  }
</style>
</head>
<body>

  <svg class="roof" viewBox="0 0 400 300" aria-hidden="true">
    <path class="left" d="M 200 75 L 20 295" />
    <path class="right" d="M 200 75 L 380 295" />
  </svg>

  <div class="card">
    <p class="eyebrow">Administración de condominios</p>
    <h1 class="wordmark"><span class="var">VAR</span><span class="elza">ELZA</span></h1>
    <p class="tagline">Todo bajo un mismo techo</p>
    <p class="msg">Estamos construyendo el portal web de VARELZA — cobranza, avisos, asambleas y más, todo en un mismo lugar para tu condominio. Muy pronto estará listo.</p>
    <a class="contact" href="mailto:hola@varelza.app">Escríbenos → hola@varelza.app</a>
  </div>

  <footer>&copy; 2026 VARELZA</footer>

</body>
</html>
